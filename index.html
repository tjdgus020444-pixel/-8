<!DOCTYPE html>
<html lang="ko" class="h-full bg-black text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대흥동 예술가 아카이빙 : DAEHEUNG ARTIST ARCHIVE</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDK (v9/v10 Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <script>
    // Firebase Config (발급받으신 Key 적용)
    const firebaseConfig = {
      apiKey: "AIzaSyB9FO8x6YQOSj78X-Nx8tpIxlxTNKyA3Xo",
      authDomain: "architecture8-a41e4.firebaseapp.com",
      projectId: "architecture8-a41e4",
      storageBucket: "architecture8-a41e4.firebasestorage.app",
      messagingSenderId: "675299744571",
      appId: "1:675299744571:web:f9aee1adc57312bd64751e",
      measurementId: "G-2466Q9TCWE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'Noto Sans KR', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
            mono: ['Courier New', 'monospace']
          },
          colors: {
            brand: {
              black: '#000000',
              white: '#ffffff',
              darkgray: '#121212',
              midgray: '#262626'
            }
          },
          boxShadow: {
            'sharp-white': '4px 4px 0px 0px #ffffff',
            'sharp-black': '4px 4px 0px 0px #000000',
            'sharp-gray': '4px 4px 0px 0px #262626',
          }
        }
      }
    }
  </script>

  <style>
    * { border-radius: 0px !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; border-left: 1px solid #262626; }
    ::-webkit-scrollbar-thumb { background: #ffffff; }
    .btn-sharp {
      border: 1px solid #ffffff;
      background: #000000;
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
      box-shadow: 3px 3px 0px 0px #ffffff;
    }
    .btn-sharp:hover {
      background: #ffffff;
      color: #000000;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px 0px #ffffff;
    }
    .file-drop-area {
      border: 2px dashed #404040;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans bg-black text-white selection:bg-white selection:text-black border-t-4 border-white">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-black border-b border-white/20 px-4 lg:px-8 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="#" onclick="showSection('gallery')" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white text-black font-display font-black text-2xl flex items-center justify-center border border-white">
          大
        </div>
        <div>
          <span class="font-display font-extrabold text-xl tracking-tighter uppercase block leading-none">대흥동 예술가 아카이빙</span>
          <span class="font-mono text-[10px] text-zinc-400 tracking-widest uppercase block mt-1">DAEHEUNG ARTIST ARCHIVE</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-xs tracking-widest uppercase font-bold">
        <button onclick="showSection('gallery')" id="nav-gallery" class="text-white border-b-2 border-white pb-1">
          ALL WORKS
        </button>
        <button onclick="showSection('artists')" id="nav-artists" class="text-zinc-500 hover:text-white border-b-2 border-transparent pb-1">
          ARTISTS DIRECTORY
        </button>
      </nav>

      <div id="auth-widget" class="flex items-center gap-4"></div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 lg:px-8 py-8">
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- SECTION 1: GALLERY -->
    <section id="section-gallery" class="space-y-8">
      <div class="border-2 border-white p-6 md:p-10 bg-black relative shadow-sharp-white">
        <div class="max-w-2xl relative z-10">
          <div class="inline-block px-3 py-1 bg-white text-black font-mono text-[11px] font-bold uppercase tracking-widest mb-4">
            [ FIREBASE REALTIME SYNC ONLINE ]
          </div>
          <h1 class="font-display text-4xl md:text-5xl font-extrabold uppercase tracking-tight leading-none mb-4">
            대흥동 예술가<br>작품 아카이브 & QR
          </h1>
          <p class="text-zinc-400 text-sm font-normal leading-relaxed mb-6">
            모든 기기에서 실시간 공유되는 대흥동 지역 작가 포트폴리오 플랫폼입니다. 내 PC에서 바로 작품을 등록하면 실시간 연동 QR 코드가 발급됩니다.
          </p>
          <div class="flex flex-wrap gap-4">
            <button onclick="handleRegisterArtBtnClick()" class="btn-sharp px-6 py-3 text-xs flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> 작품 등록하기
            </button>
            <button onclick="showSection('artists')" class="px-6 py-3 border border-zinc-700 bg-zinc-900 text-white text-xs font-bold uppercase">
              작가 목록 둘러보기
            </button>
          </div>
        </div>
      </div>

      <!-- FILTER -->
      <div class="border border-white/20 p-4 bg-zinc-950 flex flex-col md:flex-row justify-between items-center gap-4">
        <div id="category-filters" class="flex items-center gap-2 overflow-x-auto font-mono text-xs w-full md:w-auto">
          <button onclick="filterGallery('All')" class="cat-btn px-3 py-1.5 bg-white text-black font-bold uppercase border border-white">ALL</button>
          <button onclick="filterGallery('ARCHITECTURE')" class="cat-btn px-3 py-1.5 bg-black text-zinc-400 font-bold uppercase border border-zinc-800">ARCHITECTURE (건축)</button>
          <button onclick="filterGallery('PAINTING')" class="cat-btn px-3 py-1.5 bg-black text-zinc-400 font-bold uppercase border border-zinc-800">PAINTING (회화)</button>
          <button onclick="filterGallery('SCULPTURE')" class="cat-btn px-3 py-1.5 bg-black text-zinc-400 font-bold uppercase border border-zinc-800">SCULPTURE (조형)</button>
          <button onclick="filterGallery('INSTALLATION')" class="cat-btn px-3 py-1.5 bg-black text-zinc-400 font-bold uppercase border border-zinc-800">INSTALLATION (설치)</button>
        </div>
      </div>

      <!-- GRID -->
      <div id="artwork-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>

    <!-- SECTION 2: ARTISTS -->
    <section id="section-artists" class="hidden space-y-6">
      <div class="border-b-2 border-white pb-4 flex justify-between items-end">
        <div>
          <h2 class="font-display text-3xl font-extrabold uppercase">REGISTERED ARTISTS</h2>
          <p class="text-zinc-400 text-xs font-mono mt-1">대흥동 아카이빙에 등록된 작가 목록입니다.</p>
        </div>
        <button onclick="openAuthModal('register')" class="btn-sharp px-4 py-2 text-xs">+ 작가 등록</button>
      </div>
      <div id="artists-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- SECTION 3: ARTIST PROFILE -->
    <section id="section-artist-profile" class="hidden space-y-8">
      <div id="artist-profile-header" class="border-2 border-white p-6 md:p-8 bg-zinc-950"></div>
      <div id="artist-artworks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <!-- MODALS -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
    <div class="bg-black border-2 border-white max-w-md w-full p-6 relative">
      <button onclick="closeModal('auth-modal')" class="absolute top-4 right-4 text-white"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex border-b-2 border-zinc-800 mb-6 font-mono text-xs font-bold uppercase">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-white border-b-2 border-white">[ LOGIN ]</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-3 text-zinc-500 border-b-2 border-transparent">[ REGISTER ]</button>
      </div>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="login-name" required placeholder="작가명을 입력하세요" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white">
        <input type="password" id="login-password" required placeholder="비밀번호" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white">
        <button type="submit" class="btn-sharp w-full py-3 text-xs">로그인 &rarr;</button>
      </form>
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <input type="text" id="reg-name" required placeholder="작가명 입력" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white">
        <input type="password" id="reg-password" required placeholder="비밀번호" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white">
        <textarea id="reg-bio" rows="2" placeholder="작가 소개글..." class="w-full bg-black border border-zinc-700 p-3 text-xs text-white"></textarea>
        <button type="submit" class="btn-sharp w-full py-3 text-xs">작가 등록 완료 &rarr;</button>
      </form>
    </div>
  </div>

  <div id="artwork-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
    <div class="bg-black border-2 border-white max-w-lg w-full p-6 relative">
      <button onclick="closeModal('artwork-modal')" class="absolute top-4 right-4 text-white"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="font-display text-2xl font-extrabold uppercase mb-4">NEW WORK UPLOAD</h3>
      <form onsubmit="handleCreateArtwork(event)" class="space-y-4">
        <input type="text" id="art-title" required placeholder="작품 제목" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white">
        <select id="art-category" class="w-full bg-black border border-zinc-700 p-3 text-xs text-white font-mono">
          <option value="ARCHITECTURE">ARCHITECTURE (건축 / 공간)</option>
          <option value="PAINTING">PAINTING (회화)</option>
          <option value="SCULPTURE">SCULPTURE (조형)</option>
          <option value="INSTALLATION">INSTALLATION (설치)</option>
        </select>
        <input type="file" id="art-file" accept="image/*" required class="w-full bg-black border border-zinc-700 p-2 text-xs text-white">
        <textarea id="art-desc" rows="3" placeholder="작품 설명..." class="w-full bg-black border border-zinc-700 p-3 text-xs text-white"></textarea>
        <button type="submit" class="btn-sharp w-full py-3 text-xs">작품 등록 & DB 실시간 저장 &rarr;</button>
      </form>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('daeheung_user')) || null;
    let activeFilter = 'All';

    window.onload = function() {
      renderAuthWidget();
      loadArtworksFromFirebase();
      loadArtistsFromFirebase();
    };

    function showSection(name) {
      document.getElementById('section-gallery').classList.add('hidden');
      document.getElementById('section-artists').classList.add('hidden');
      document.getElementById('section-artist-profile').classList.add('hidden');
      document.getElementById(`section-${name}`).classList.remove('hidden');
    }

    function renderAuthWidget() {
      const container = document.getElementById('auth-widget');
      if (currentUser) {
        container.innerHTML = `
          <span class="font-mono text-xs text-white font-bold">${currentUser.name}</span>
          <button onclick="openArtworkModal()" class="btn-sharp px-3 py-1.5 text-xs">+ UPLOAD</button>
        `;
      } else {
        container.innerHTML = `
          <button onclick="openAuthModal('login')" class="btn-sharp px-3 py-1.5 text-xs">LOGIN / REGISTER</button>
        `;
      }
    }

    function openAuthModal(tab) {
      document.getElementById('auth-modal').classList.remove('hidden');
    }
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const password = document.getElementById('reg-password').value;
      const bio = document.getElementById('reg-bio').value.trim();

      const artistData = { name, password, bio, createdAt: new Date().toISOString() };
      db.collection("artists").add(artistData).then(docRef => {
        currentUser = { id: docRef.id, ...artistData };
        localStorage.setItem('daeheung_user', JSON.stringify(currentUser));
        renderAuthWidget();
        closeModal('auth-modal');
        alert("작가 등록 및 로그인 성공!");
      });
    }

    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-name').value.trim();
      const password = document.getElementById('login-password').value;

      db.collection("artists").where("name", "==", name).where("password", "==", password).get()
        .then(snapshot => {
          if (!snapshot.empty) {
            const doc = snapshot.docs[0];
            currentUser = { id: doc.id, ...doc.data() };
            localStorage.setItem('daeheung_user', JSON.stringify(currentUser));
            renderAuthWidget();
            closeModal('auth-modal');
            alert("로그인 완료!");
          } else {
            alert("작가명 또는 비밀번호가 틀립니다.");
          }
        });
    }

    function openArtworkModal() {
      document.getElementById('artwork-modal').classList.remove('hidden');
    }

    function handleCreateArtwork(e) {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('art-title').value.trim();
      const category = document.getElementById('art-category').value;
      const desc = document.getElementById('art-desc').value.trim();
      const file = document.getElementById('art-file').files[0];

      if (!file) return;

      const storageRef = storage.ref(`artworks/${Date.now()}_${file.name}`);
      storageRef.put(file).then(snapshot => {
        return snapshot.ref.getDownloadURL();
      }).then(downloadURL => {
        return db.collection("artworks").add({
          title,
          category,
          desc,
          imageUrl: downloadURL,
          artistId: currentUser.id,
          artistName: currentUser.name,
          createdAt: new Date().toISOString()
        });
      }).then(() => {
        closeModal('artwork-modal');
        alert("작품 등록 완료! 다른 기기에서도 실시간으로 동기화됩니다.");
        loadArtworksFromFirebase();
      });
    }

    function loadArtworksFromFirebase() {
      db.collection("artworks").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const grid = document.getElementById('artwork-grid');
        grid.innerHTML = snapshot.docs.map(doc => {
          const art = doc.data();
          return `
            <div class="border-2 border-white bg-black p-3 shadow-sharp-gray">
              <img src="${art.imageUrl}" class="w-full aspect-square object-cover mb-2 border border-white">
              <span class="font-mono text-[10px] bg-white text-black font-bold px-1">${art.category}</span>
              <h4 class="font-bold uppercase mt-1">${art.title}</h4>
              <p class="font-mono text-xs text-zinc-400">BY ${art.artistName}</p>
            </div>
          `;
        }).join('');
      });
    }

    function loadArtistsFromFirebase() {
      db.collection("artists").get().then(snapshot => {
        const grid = document.getElementById('artists-grid');
        grid.innerHTML = snapshot.docs.map(doc => {
          const a = doc.data();
          return `
            <div class="border-2 border-white bg-black p-6">
              <h3 class="font-bold text-lg">${a.name}</h3>
              <p class="text-xs text-zinc-400 mt-2">${a.bio}</p>
            </div>
          `;
        }).join('');
      });
    }
  </script>
</body>
</html>
